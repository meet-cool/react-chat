      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="heart" d="M0,-15 C-8,-25 -20,-20 -20,-10 C-20,0 0,15 0,20 C0,15 20,0 20,-10 C20,-20 8,-25 0,-15Z"/>
  </defs>
